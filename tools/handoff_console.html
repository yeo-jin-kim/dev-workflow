<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Development review · 개발 검토</title>
<style>body{font:16px system-ui;margin:0;background:#f3f5fa;color:#182436}main{max-width:1200px;margin:auto;padding:24px}article,section{background:white;border:1px solid #d8dfeb;border-radius:12px;padding:18px;margin:14px 0}h1{font-size:25px}h2{font-size:20px}h3{font-size:16px}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.columns>section{min-width:0}p,pre{overflow-wrap:anywhere;white-space:pre-wrap}button,select,textarea{font:inherit;padding:10px;border:1px solid #aeb9cc;border-radius:6px}button{cursor:pointer;background:#edf3ff}button:disabled{opacity:.5;cursor:default}textarea{box-sizing:border-box;width:100%}.tag{padding:4px 9px;border-radius:14px;background:#e7efff;display:inline-block}svg{width:100%;height:320px;border:1px solid #ddd;overflow:hidden}svg text{font:11px system-ui}.muted{color:#55667c}label{display:block;padding:5px}.error{color:#a32323}a{color:#154eaa}@media(max-width:800px){.columns{grid-template-columns:1fr}main{padding:12px}}</style>
<main><h1>Development review / 개발 검토</h1><p>Compare evidence, record your test, then decide whether to request a merge.<br>근거를 비교하고 직접 테스트한 결과를 기록한 뒤 병합 요청 여부를 결정하세요.</p><p id="connection" role="status"></p><nav id="list"></nav><div id="content"></div></main>
<script>
const labels={historical_comparison_only:'Historical comparison only / 과거 결과 비교 전용',browser_verifying:'Checking browser behavior / 브라우저 검증 중',candidate_ci:'Checking candidate CI / 후보 CI 확인 중',publishing:'Publishing candidate branch / 후보 브랜치 게시 중',remote_checking:'Checking remote CI / 원격 CI 확인 중',reporting:'Preparing review report / 검토 보고서 작성 중',prepared:'Preparing repair / 수정 준비 중',preflight:'Checking prerequisites / 실행 조건 확인 중',ready_for_merge_approval:'Ready for your test / 휴먼 테스트 대기',budget_exhausted:'Execution allowance exhausted / 실행 한도 소진',incomplete_published:'Incomplete candidate saved / 미완료 후보 보존됨',queued:'Queued / 접수됨',running:'Running / 실행 중',revalidating:'Reproducing current version / 현재 버전 재현 중',replaying:'Reproducing / 재현 중',reviewing:'Independent review / 독립 검토 중',checking:'Validating / 검증 중',implementing:'Repairing / 수정 중',awaiting_human_retest:'Ready for your test / 휴먼 테스트 대기',awaiting_owner_merge_authorization:'Awaiting merge decision / 병합 결정 대기',decision_required:'Your decision is needed / 결정 필요',already_integrated:'Already merged / 병합 완료',merged_and_pushed:'Merged and pushed / 병합·푸시 완료',stale_target_requires_revalidation:'Target changed; revalidation required / 대상 변경·재검증 필요',pass:'Test passed / 테스트 통과',hold:'On hold / 판단 보류',changes_requested:'Changes requested / 수정 요청'};const label=s=>labels[s]||s;
let session,selected=new URLSearchParams(location.search).get('id'),lastSignature='';
const el=(tag,text,parent,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;if(parent)parent.append(e);return e};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Review-Token':session?.token||'','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d;try{d=await r.json()}catch(e){throw Error('The service returned a non-JSON response. / 서비스 응답을 읽지 못했습니다.')}if(!r.ok)throw Error(d.error||r.status);return d}
function graph(parent,response){const states=response?.graph?.states||[],edges=response?.graph?.relations||[];const claims=new Set((response?.answer?.claims||[]).map(c=>(c.claimId||'').replace(/^claim:/,'')));const nodes=states.filter(s=>claims.has(s.stateId));for(const s of states){if(nodes.length>=16)break;if(!nodes.includes(s))nodes.push(s)}
const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 540 320');svg.setAttribute('role','img');svg.setAttribute('aria-label','Captured response graph / 저장된 응답 그래프');parent.append(svg);const positions=new Map(nodes.map((n,i)=>[n.stateId,{x:80+(i%4)*130,y:35+Math.floor(i/4)*78}]));
for(const edge of edges){const a=positions.get(edge.sourceStateId),b=positions.get(edge.targetStateId);if(!a||!b)continue;const l=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#bcc9d9'}))l.setAttribute(k,v);svg.append(l)}
for(const n of nodes){const p=positions.get(n.stateId),c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',claims.has(n.stateId)?11:6);c.setAttribute('fill',claims.has(n.stateId)?'#2469b5':'#8297ad');svg.append(c);const t=document.createElementNS(ns,'text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+24);t.setAttribute('text-anchor','middle');t.textContent=(n.label||n.stateId).slice(0,23);const title=document.createElementNS(ns,'title');title.textContent=n.label||n.stateId;t.append(title);svg.append(t)}
el('p',`Captured graph subset: ${nodes.length}/${states.length} nodes. Blue = answer claim; lines = returned relations. Layout is for comparison, not cognitive distance. / 저장된 그래프 일부: ${nodes.length}/${states.length}개 노드. 파랑은 답변 항목, 선은 반환된 관계입니다. 배치는 비교용이며 인지적 거리가 아닙니다.`,parent,'muted');}
function responsePanel(parent,title,response){const box=el('section',undefined,parent);el('h2',title,box);el('p',response?.answer?.summary||'Unavailable / 없음',box);if(!response)return;graph(box,response);const details=el('details',undefined,box);el('summary','Claims, paths and evidence / 답변 항목·경로·근거',details);el('pre',JSON.stringify({claims:response.answer?.claims,evidence:response.evidence,paths:response.trace?.activationPaths},null,2),details)}
async function load(){const items=await api('/api/items');const list=document.querySelector('#list');list.replaceChildren();for(const item of items){const a=el('a',`${item.query||item.id.slice(0,10)} · ${label(item.status)}`,list);a.href='?id='+encodeURIComponent(item.id);el('br','',list)}if(!selected)return;const item=await api('/api/items/'+selected);const signature=JSON.stringify(item);if(signature===lastSignature)return;if(document.querySelector('#reason')?.value)return;lastSignature=signature;
const main=document.querySelector('#content');main.replaceChildren();el('h2',item.query||'Request / 요청',main);el('p',label(item.status),main,'tag');el('p',item.reason||'',main);if(item.proofIssue)el('p','Historical proof cannot be fully revalidated now; no new approval is allowed. / 과거 검증 자료를 현재 완전히 재확인할 수 없어 새 승인은 허용하지 않습니다. '+item.proofIssue,main,'muted');el('p','Received → Reproduce → Repair → Validate → Human retest → Owner merge authorization / 접수 → 재현 → 수정 → 검증 → 휴먼 테스트 → 사용자 병합 승인',main,'muted');const cols=el('div',undefined,main,'columns');responsePanel(cols,'Before / 수정 전',item.before);responsePanel(cols,'Candidate / 수정 후 후보',item.after);if(item.current)responsePanel(main,'Current-version reproduction / 현재 버전 재현',item.current);
if(item.report){el('p',`Candidate ${item.report.source_sha}\nTarget ${item.report.target_branch} @ ${item.report.target_sha}`,main);el('p',`Independent review: ${item.report.review?.verdict}; CI: ${item.report.ci?.status} / 독립 검토·CI 상태`,main)}
if(item.binding){const b=el('details',undefined,main);el('summary','Source/data bindings and regression checks / 소스·데이터 연결과 회귀 검사',b);el('pre',JSON.stringify({bindings:item.binding,regressions:item.regressions},null,2),b)}
if(item.retest)el('p',`Last test / 마지막 테스트: ${item.retest.decision} — ${item.retest.reason}`,main);if(item.merge)el('p',`Merge / 병합: ${item.merge.status}`,main);if(!item.canRetest){el('p',item.status==='already_integrated'?'This candidate is already included in the observed target. This is a historical comparison; no new merge is needed. / 관찰한 대상 버전에 이미 포함된 후보입니다. 과거 비교이며 새 병합은 필요 없습니다.':'No current candidate is available for a new acceptance decision. / 새 통과 판정을 위한 현재 후보가 없습니다.',main);return}
const form=el('section',undefined,main);el('h2','Your test result / 직접 테스트한 결과',form);const decision=el('select',undefined,form);decision.id='decision';for(const [value,text]of[['hold','Hold / 판단 보류'],['pass','Pass / 통과'],['changes_requested','Request changes / 수정 요청']]){const o=el('option',text,decision);o.value=value}const reason=el('textarea',undefined,form);reason.id='reason';reason.setAttribute('aria-label','Test result reason / 테스트 판단 근거');reason.placeholder='What did you test? What should change? / 무엇을 확인했고 무엇을 수정해야 하나요?';const save=el('button','Save test result / 테스트 결과 저장',form);const status=el('p','',form);status.setAttribute('role','status');save.onclick=async()=>{try{await api('/api/items/'+selected+'/retest',{decision:decision.value,reason:reason.value});reason.value='';lastSignature='';await load()}catch(e){status.textContent=e.message}};
el('p','This saves test notes. It does not approve a merge or restart an exhausted worker. A new repair request must use the existing Recall review flow. / 테스트 기록이며 병합 승인이나 소진된 작업의 재시작이 아닙니다. 새 수정 요청은 기존 Recall 검토 흐름으로 제출하세요.',form,'muted');
const assertions=el('section',undefined,main);el('h2','Keep as a regression case / 회귀 검사 사례로 보존',assertions);el('p','Select the claims that must remain present. Save a passing test first. / 계속 포함되어야 하는 답변 항목을 선택하세요. 통과 테스트를 먼저 저장하세요.',assertions);for(const c of item.after?.answer?.claims||[]){const l=el('label',undefined,assertions),input=el('input',undefined,l);input.type='checkbox';input.value=c.claimId;input.name='required-claim';input.checked=(item.case?.required_claims||[]).includes(c.claimId);l.append(document.createTextNode(c.text||c.claimId))}const keep=el('button','Preserve selected assertions / 선택한 조건 보존',assertions);keep.disabled=item.retest?.decision!=='pass';keep.onclick=async()=>{try{const required=[...assertions.querySelectorAll('input:checked')].map(e=>e.value);await api('/api/items/'+selected+'/preserve',{required,forbidden:[]});status.textContent='Regression case saved privately. / 회귀 사례를 비공개로 저장했습니다.'}catch(e){status.textContent=e.message}};
if(item.case)el('p','Regression case preserved / 회귀 사례 보존됨',assertions);el('h2','Merge handoff / 병합 인계',main);el('p','After checking this exact revision, ask the operator to merge it. The operator verifies both branch heads and reruns trusted checks before pushing. / 이 버전을 확인한 뒤 작업자에게 병합을 요청하세요. 작업자는 양쪽 브랜치 버전과 필수 검사를 다시 확인한 후 푸시합니다.',main);}
async function tick(){try{await load();document.querySelector('#connection').textContent='Connected · refreshes every 3 seconds / 연결됨 · 3초마다 상태 갱신'}catch(e){document.querySelector('#connection').textContent=e.message}}
(async()=>{try{session=await(await fetch('/api/session')).json();await tick();setInterval(tick,3000)}catch(e){document.querySelector('#connection').textContent=e.message}})();
</script></html>
